site_name: KUKA iiwa 7 R800 — Simulated Digital Twin
site_description: >-
  NVIDIA Isaac Sim digital twin of the KUKA LBR iiwa 7 R800 with Cartesian
  impedance / force control.
site_url: https://jeffrichley.github.io/kuka-iiwa-sim/
repo_url: https://github.com/jeffrichley/kuka-iiwa-sim
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.arithmatex:      # LaTeX math ($$...$$ and \(...\)) via MathJax
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Keep the internal research/spec docs out of the published site.
exclude_docs: |
  superpowers/
  quickstart.md
  assets.md

nav:
  - Home: index.md
  - Setup:
      - Install: install.md
      - Build the robot asset: build-asset.md
  - Using the twin:
      - Run the demos: running-demos.md
      - Control API: api.md
      - Write an experiment: writing-experiments.md
  - How it works: how-it-works.md
